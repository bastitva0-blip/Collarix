<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA theme -->
    <meta name="theme-color" content="#4A6741" />
    <meta name="background-color" content="#F7F5F0" />

    <!-- App meta -->
    <meta name="description" content="Collarix – Smart Pet Care. Track feeding, health records, reminders and more for your pets." />
    <meta name="application-name" content="Collarix" />
    <meta name="keywords" content="pet care, dog, cat, reminders, vet, collarix" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Collarix" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/collarix-logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />

    <!-- Android / Open Graph -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Collarix – Smart Pet Care" />
    <meta property="og:description" content="Track feeding, health, reminders & QR profiles for your pets." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:type" content="website" />

    <!-- MS Tiles -->
    <meta name="msapplication-TileColor" content="#4A6741" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/logo192.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Collarix – Smart Pet Care</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Collarix.</noscript>
    <div id="root"></div>
  </body>
</html>
